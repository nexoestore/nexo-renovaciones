name: Control Cuentas Streaming APK firmado

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Localizar y descomprimir ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No hay ningún archivo ZIP en el repositorio."
            exit 1
          fi
          echo "ZIP encontrado: $ZIP_FILE"
          mkdir -p proyecto
          unzip -o "$ZIP_FILE" -d proyecto

      - name: Detectar carpeta del proyecto Android
        shell: bash
        run: |
          SETTINGS_FILE="$(find proyecto -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts ni settings.gradle."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Proyecto Android encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verificar Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Reconstruir clave privada
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: Falta el secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexo-release.jks"
          chmod 600 "$RUNNER_TEMP/nexo-release.jks"

      - name: Compilar APK release
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --stacktrace

      - name: Localizar APK release
        shell: bash
        run: |
          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No se encontró APK release."
            exit 1
          fi
          echo "APK sin firmar: $APK_FILE"
          echo "UNSIGNED_APK=$APK_FILE" >> "$GITHUB_ENV"

      - name: Alinear y firmar APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" "$RUNNER_TEMP/ControlCuentasStreaming-aligned.apk"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/nexo-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/ControlCuentasStreaming-signed.apk" \
            "$RUNNER_TEMP/ControlCuentasStreaming-aligned.apk"

          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/ControlCuentasStreaming-signed.apk"
          echo "SIGNED_APK=$RUNNER_TEMP/ControlCuentasStreaming-signed.apk" >> "$GITHUB_ENV"

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: ControlCuentasStreaming-firmado
          path: ${{ env.SIGNED_APK }}
          if-no-files-found: error
