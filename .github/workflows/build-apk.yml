name: Control Cuentas Streaming v7.4.1 - Diagnostico claro

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Localizar y descomprimir ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No hay ningún archivo ZIP en el repositorio."
            exit 1
          fi
          rm -rf proyecto
          mkdir -p proyecto
          unzip -o "$ZIP_FILE" -d proyecto
          SETTINGS_FILE="$(find proyecto -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró el proyecto Android."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -f "$SDKMANAGER" || { echo "ERROR: No se encontró sdkmanager"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validar firma
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Falta ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASS" || { echo "Falta KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ALIAS" || { echo "Falta KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASS" || { echo "Falta KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nexo-release.jks"
          test -s "$RUNNER_TEMP/nexo-release.jks" || { echo "ERROR: keystore vacío"; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/nexo-release.jks" >> "$GITHUB_ENV"

      - name: 1 - Pruebas automaticas
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle :app:testReleaseUnitTest --stacktrace

      - name: Guardar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-Pruebas-v7.4.1
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/testReleaseUnitTest/**
            ${{ env.PROJECT_DIR }}/app/build/test-results/testReleaseUnitTest/**
          if-no-files-found: warn

      - name: 2 - Revisar Lint
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle :app:lintRelease --stacktrace

      - name: Guardar reporte Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-Lint-v7.4.1
          path: ${{ env.PROJECT_DIR }}/app/build/reports/lint-results-release.*
          if-no-files-found: warn

      - name: 3 - Compilar APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --stacktrace

      - name: 4 - Compilar AAB Google Play
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle :app:bundleRelease --stacktrace

      - name: 5 - Verificar firma y localizar archivos
        shell: bash
        run: |
          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)"
          AAB_FILE="$(find "$PROJECT_DIR/app/build/outputs/bundle/release" -type f -name '*.aab' | head -n 1)"
          test -f "$APK_FILE" || { echo "ERROR: no se encontró APK"; exit 1; }
          test -f "$AAB_FILE" || { echo "ERROR: no se encontró AAB"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_FILE"
          jarsigner -verify "$AAB_FILE"
          sha256sum "$APK_FILE" "$AAB_FILE" | tee "$RUNNER_TEMP/release-sha256.txt"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "AAB_FILE=$AAB_FILE" >> "$GITHUB_ENV"
          echo "CHECKSUM_FILE=$RUNNER_TEMP/release-sha256.txt" >> "$GITHUB_ENV"

      - name: 6 - Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ControlStreaming-v7.4.1-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: 7 - Subir AAB Google Play
        uses: actions/upload-artifact@v4
        with:
          name: ControlStreaming-v7.4.1-GooglePlay-AAB
          path: ${{ env.AAB_FILE }}
          if-no-files-found: error

      - name: Guardar SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: ControlStreaming-v7.4.1-SHA256
          path: ${{ env.CHECKSUM_FILE }}
          if-no-files-found: warn
